{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- favicon -->
    <link rel="icon" href="{% static 'images/recipe_logo.png' %}" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    

    <title>Recipe Manager</title>

</head>

<body>

<nav class="navbar custom-navbar">

    <div class="container-fluid px-5">

        <a href="{% url 'recipe_list' %}" class="navbar-brand brand-logo">
            Recipe Manager
        </a>

        <div class="nav-buttons">

            {% if request.resolver_match.url_name != 'recipe_list' %}
                <a href="{% url 'recipe_list' %}" class="btn home-btn">
                    Home
                </a>
            {% endif %}

            <a href="{% url 'recipe_form' %}" class="btn add-btn">
                Add Recipe
            </a>

        </div>

    </div>

</nav>


<div class="container py-5">

    {% if messages %}
        <div class="message-container">

            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>

                </div>
            {% endfor %}

        </div>
    {% endif %}


    {% block content %}
    {% endblock %}

</div>


<footer class="footer">

    <p>Recipe Manager by Aswanth cv © 2026</p>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
